# Browser front door for the bridge dev cluster (hpdevkit nodes on localhost:8081-8083, self-signed).
# Valid TLS on 8443-8445 so hotpocket-js-client in a browser can connect. Ports are firewalled for
# everything else; the DOCKER-USER rules keep 8081-8083 local.
server {
    listen 80;
    server_name bridge-dev.blumefi.com;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 404; }
}
server {
    listen 8443 ssl;
    server_name bridge-dev.blumefi.com;
    ssl_certificate /etc/letsencrypt/live/bridge-dev.blumefi.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bridge-dev.blumefi.com/privkey.pem;
    location / {
        proxy_pass http://127.0.0.1:9081; # bridge-front relay (PM2) -> wss://127.0.0.1:8081
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host 127.0.0.1;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
server {
    listen 8444 ssl;
    server_name bridge-dev.blumefi.com;
    ssl_certificate /etc/letsencrypt/live/bridge-dev.blumefi.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bridge-dev.blumefi.com/privkey.pem;
    location / {
        proxy_pass http://127.0.0.1:9082; # bridge-front relay (PM2) -> wss://127.0.0.1:8082
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host 127.0.0.1;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
server {
    listen 8445 ssl;
    server_name bridge-dev.blumefi.com;
    ssl_certificate /etc/letsencrypt/live/bridge-dev.blumefi.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bridge-dev.blumefi.com/privkey.pem;
    location / {
        proxy_pass http://127.0.0.1:9083; # bridge-front relay (PM2) -> wss://127.0.0.1:8083
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host 127.0.0.1;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
