[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
via_ir = true
optimizer = true
optimizer_runs = 200
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]

[rpc_endpoints]
xrpl_evm_mainnet = "https://rpc.xrplevm.org"
xrpl_evm_testnet = "https://rpc.testnet.xrplevm.org"
